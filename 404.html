<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script>/* Ancienne adresse GitHub → nom de domaine officiel */ if (location.hostname.endsWith(".github.io")) location.replace("https://jbprovencephotography.com" + location.pathname.replace(/^\/[^\/]+/, "") + location.search + location.hash);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page introuvable — JB Provence Photography</title>
  <meta name="robots" content="noindex">
  <script>
    // Sur jazycode.github.io/Jb-provence-Photography/, le site n'est pas à la racine du domaine :
    // on fait pointer les liens vers le bon dossier. Avec un nom de domaine personnalisé, rien ne change.
    (function () {
      var base = "/";
      if (location.hostname.endsWith(".github.io")) {
        var first = location.pathname.split("/")[1];
        if (first) base = "/" + first + "/";
      }
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eee3d4; color: #171611; font-family: Arial, Helvetica, sans-serif; text-align: center; }
    img { width: 180px; height: auto; }
    h1 { margin: 24px 0 12px; font: 400 clamp(40px, 7vw, 72px)/1 Georgia, serif; letter-spacing: -.04em; }
    em { color: #b38a45; }
    p { color: #5f584f; }
    a { display: inline-block; margin-top: 18px; padding: 14px 19px; background: #171611; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
    a:hover, a:focus-visible { background: #8a6631; }
  </style>
</head>
<body>
  <main>
    <img src="assets/images/logo.png" alt="JB Provence Photography">
    <h1>Cette page <em>s’est égarée.</em></h1>
    <p>Le lien suivi n’existe pas ou a été déplacé.</p>
    <a href="./">Retour à l’accueil</a>
  </main>
</body>
</html>
