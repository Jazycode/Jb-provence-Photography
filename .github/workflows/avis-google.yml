name: Avis Google

on:
  schedule:
    - cron: "17 5 * * *"   # chaque jour vers 7 h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les avis Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: python tools/maj_avis_google.py
      - name: Publier si changement
        run: |
          if ! git diff --quiet assets/js/avis.js; then
            git config user.name "Avis Google (auto)"
            git config user.email "jbprovencephotography@gmail.com"
            git add assets/js/avis.js
            git commit -m "Avis Google mis à jour automatiquement"
            git push
          fi
